<body>
<div id="root"></div>
<script>
'use strict';
document.documentElement.style.setProperty('--acento', CONFIG.acento);
document.title = CONFIG.titulo;

/* ===================== utilidades ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nk = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9#%]+/g, ' ').trim();
const num = v => { if (v == null || v === '') return null; if (typeof v === 'number') return isFinite(v) ? v : null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmt = (v, d = 0) => v == null || !isFinite(v) ? '—' : Number(v).toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtA = v => v == null ? '—' : (Math.round(v * 10) / 10).toLocaleString('es-ES');
const mean = a => { const b = a.filter(x => x != null && isFinite(x)); return b.length ? b.reduce((s, x) => s + x, 0) / b.length : null; };
const sum = a => a.filter(x => x != null && isFinite(x)).reduce((s, x) => s + x, 0);
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const dObj = iso => new Date(iso + 'T12:00:00Z');
const dow = iso => dObj(iso).getUTCDay();
const fCorta = iso => { if (!iso) return '—'; const d = dObj(iso); return d.getUTCDate() + ' ' + MES[d.getUTCMonth()]; };
const fLarga = iso => { if (!iso) return '—'; const d = dObj(iso); const s = DIA[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MES[d.getUTCMonth()]; return s[0].toUpperCase() + s.slice(1); };
const isoAdd = (iso, k) => { const d = dObj(iso); d.setUTCDate(d.getUTCDate() + k); return d.toISOString().slice(0, 10); };
const toDate = v => {
  if (v == null || v === '') return null;
  if (typeof v === 'number') { const d = new Date(Date.UTC(1899, 11, 30) + v * 864e5); return d.toISOString().slice(0, 10); }
  const s = String(v).trim(); const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  const m2 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m2) return `${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;
  return null;
};
const title = s => String(s || '').toLowerCase().replace(/(^|[\s-])([a-zà-ÿ])/g, (m, a, b) => a + b.toUpperCase());
const initials = s => String(s || '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
const tabla = rows => { if (!rows || !rows.length) return []; const h = rows[0].map(nk); return rows.slice(1).filter(r => r && r.length).map(r => { const o = {}; h.forEach((k, i) => { if (k && !(k in o)) o[k] = r[i]; }); return o; }); };
const groupBy = (a, f) => { const m = new Map(); a.forEach(x => { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; };
const uniq = a => [...new Set(a)];
const nameKey = s => nk(s).toUpperCase();

const ROL = { E: 'Entreno', P: 'Parcial', L: 'Lesionada', S: 'Suplente', T: 'Titular' };
const COMP = { J: ['Liga', 'liga'], CR: ['Copa de la Reina', 'copa'], C: ['Copa de la Reina', 'copa'], CC: ['Copa Catalunya', 'copa'], A: ['Amistoso', 'amistoso'], P: ['Amistoso', 'amistoso'] };
function parseSesion(s) {
  const str = String(s || '').trim();
  const m = str.match(/^([A-Z]{1,2})\s*(\d*)\s*-\s*(.+)$/);
  if (m && COMP[m[1]]) { const c = COMP[m[1]]; return { esP: true, comp: c[0] + (m[1] === 'J' && m[2] ? ' · J' + m[2] : ''), cat: c[1], rival: m[3].trim() }; }
  const a = str.match(/^amistoso\s+(.+)$/i); if (a) return { esP: true, comp: 'Amistoso', cat: 'amistoso', rival: a[1].trim() };
  return { esP: false };
}
function mensVal(v) { const s = String(v == null ? '' : v).trim().toLowerCase(); if (!s) return null; if (s === 'no') return 'No'; if (s.startsWith('bien')) return 'Bien'; if (s.startsWith('reg')) return 'Regular'; if (s.startsWith('mal')) return 'Mal'; return 'Sí'; }
const mensEs = v => v && v !== 'No';
const TONO = { Bien: '#F5B5B5', Regular: '#E06262', Mal: '#A3141B', 'Sí': '#E06262' };

/* ===================== datos ===================== */
function datos2627(t) {
  const dg = tabla(t['Datos general']);
  const daily = dg.map(r => {
    const date = toDate(r['dia']); const name = nameKey(r['nombre']);
    if (!date || !name) return null;
    const ses = String(r['n sesion'] || '').trim(); const p = parseSesion(ses);
    const fat = num(r['fatiga']), sue = num(r['sueno']), dol = num(r['dolor musc']), est = num(r['estres']);
    let well = num(r['wellness']); if (well == null && [fat, sue, dol, est].some(x => x != null)) well = (fat || 0) + (sue || 0) + (dol || 0) + (est || 0);
    const rpe = num(r['rpe']), min = num(r['minutos']); let ua = num(r['ua']); if (ua == null && rpe != null && min != null) ua = rpe * min;
    const rol = String(r['rol partido entreno'] || '').trim().toUpperCase();
    return { name, date, fat, sue, dol, est, well, mens: mensVal(r['menstruacion']), com: r['comentarios'] ? String(r['comentarios']).trim() : '',
      mc: num(r['mc']), ses, md: r['md'] ? String(r['md']).trim().toUpperCase() : '', rol, esP: p.esP, comp: p.comp || '', cat: p.cat || '', rival: p.rival || '',
      per: r['periodo'] || '', equip: r['equip'] || '', rpe, min, ua };
  }).filter(Boolean).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const tests = tabla(t['CMJ + TESTS']).map(r => ({ name: nameKey(r['nombre']), date: toDate(r['fecha']),
    cmj: num(r['cmj']), iso: num(r['fuerza iso']), rm: num(r['rm squat']), ift: num(r['30 15 ift']), m40: num(r['40m']) })).filter(r => r.name && r.date).sort((a, b) => a.date < b.date ? -1 : 1);
  const pos = {}; (t['POSICIONES JUGADORAS'] || []).slice(1).forEach(r => { if (r && r[1]) pos[nameKey(r[1])] = { equipo: r[0], dorsal: num(r[2]), linea: String(r[3] || '').toLowerCase(), pos: r[4] || '', pos2: r[5] || '', nombre: String(r[1]).trim() }; });
  const carga = {}; tabla(t['CARGA SEMANAL']).forEach(r => { const mc = num(r['mc']); if (mc != null) carga[mc] = num(r['carga semanal promedio']); });
  return { daily, tests, pos, carga, gps: false };
}
function datos2526(t) {
  const daily = tabla(t.BASE).map(r => {
    const date = toDate(r['fecha']); const name = nameKey(r['nombre del jugador']);
    if (!date || !name) return null;
    const ses = String(r['nombre de sesion'] || '').trim(); const p = parseSesion(ses);
    const rol = String(r['rol partido entreno'] || '').trim().toUpperCase();
    const tipo = String(r['tipo de sesion'] || '').toUpperCase();
    const fat = num(r['fatiga']), sue = num(r['sueno']), dol = num(r['dolor muscular']), est = num(r['estres']);
    let well = num(r['wellness']); if (well == null && [fat, sue, dol, est].some(x => x != null)) well = (fat || 0) + (sue || 0) + (dol || 0) + (est || 0);
    const rpe = num(r['rpe']), min = num(r['tiempo campo']); let ua = num(r['ua']); if (ua == null && rpe != null && min != null) ua = rpe * min;
    const hi = num(r['carreras de alta int m']), spr = num(r['carreras de max int m']);
    let hsr = num(r['hsr m']); if (hsr == null && (hi != null || spr != null)) hsr = (hi || 0) + (spr || 0);
    const aA = num(r['ace alta int #']), aM = num(r['ace max int #']), dA = num(r['desac alta int #']), dM = num(r['desac max int #']);
    const esP = p.esP || tipo === 'GAME';
    return { name, date, fat, sue, dol, est, well, mens: mensVal(r['menstruacion']), com: r['comentario'] ? String(r['comentario']).trim() : '',
      mc: num(r['mc']), ses, md: r['md'] ? String(r['md']).trim().toUpperCase() : '', rol, esP, comp: p.comp || (esP ? (r['competicion'] || 'Partido') : ''), cat: p.cat || (esP ? 'liga' : ''), rival: p.rival || (esP ? ses : ''),
      per: r['periodo'] || '', equip: r['equip'] || '', rpe, min, ua,
      dist: num(r['dist recorrida m']), hsr, spr, acc: (aA != null || aM != null) ? (aA || 0) + (aM || 0) : null, dec: (dA != null || dM != null) ? (dA || 0) + (dM || 0) : null, vmax: num(r['vel max km h']) };
  }).filter(Boolean).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  daily.forEach(d => d.hasGps = d.dist != null);
  const tests = tabla(t.cmj).map(r => ({ name: nameKey(r['nombre del jugador']), date: toDate(r['fecha']), cmj: num(r['cmj']) })).filter(r => r.name && r.date).sort((a, b) => a.date < b.date ? -1 : 1);
  return { daily, tests, pos: {}, carga: {}, gps: true };
}

/* ===================== estado ===================== */
const S = { token: null, email: null, resp: null, perfil: null, nombre: null, D: {}, season: '2627', tab: 'inicio', u: {}, staffTab: 'plantel', ficha: null };

/* ===================== entrada con Google ===================== */
function pantallaEntrada(msg) {
  $('#root').innerHTML = `<div class="login">
    <div>
      <div class="logo"><img src="${esc(CONFIG.logo)}" alt=""></div>
      <h1>${esc(CONFIG.titulo)}</h1>
      <p>Consulta tus datos de entrenamiento, wellness y tests.</p>
      ${msg ? `<div class="msg">${msg}</div>` : ''}
    </div>

}
function lineChart(pts, opt = {}) {
  // pts: [{v, l, txt}] ; opt.sel (índice), opt.act (acción al tocar), opt.color
  const W = 320, H = 170, n = pts.length; if (!n) return '<div class="empty">Sin datos</div>';
  const vs = pts.map(p => p.v).filter(v => v != null); const mn = Math.min(...vs), mx = Math.max(...vs), rg = (mx - mn) || 1;
  const col = opt.color || 'var(--acento)';
  const xy = pts.map((p, i) => ({ x: n === 1 ? W / 2 : 24 + i * ((W - 48) / (n - 1)), y: p.v == null ? null : 120 - ((p.v - mn) / rg) * 85 }));
  const path = xy.filter(p => p.y != null).map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const step = Math.ceil(n / 7);
  let g = `<line x1="10" y1="140" x2="${W - 10}" y2="140" stroke="#CDD4DD"/><polyline points="${path}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p, i) => {
    const q = xy[i]; if (q.y == null) return; const on = i === opt.sel;
    if (on) g += `<line x1="${q.x}" y1="${q.y}" x2="${q.x}" y2="140" stroke="${col}" stroke-dasharray="3 3"/>`;
    g += `<circle cx="${q.x}" cy="${q.y}" r="${on ? 6.5 : 4.5}" fill="${on ? col : '#fff'}" stroke="${col}" stroke-width="2.5"/>`;
    if (on || n <= 8) g += `<text x="${q.x}" y="${q.y - 10}" text-anchor="middle" font-size="10" font-weight="600" fill="#141A22">${esc(p.txt != null ? p.txt : fmtA(p.v))}</text>`;
    if (i % step === 0 || on) g += `<text x="${q.x}" y="158" text-anchor="middle" font-size="10" fill="#5B6675">${esc(p.l)}</text>`;
    if (opt.act) g += `<circle cx="${q.x}" cy="${q.y}" r="18" fill="transparent" data-act="${opt.act}" data-v="${i}" style="cursor:pointer"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(opt.label || 'Gráfica de evolución')}">${g}</svg>`;
}
const rolPill = r => { const t = ROL[r] || r || '—'; const c = r === 'T' ? 't' : r === 'S' || r === 'P' ? 's' : r === 'L' ? 'l' : ''; return `<span class="pill ${c}">${esc(t)}</span>`; };

function porSesion(daily) { return daily.filter(d => d.rpe != null || d.esP || d.dist != null); }

function mensMapa(daily) { const rank = { No: 0, 'Sí': 1, Bien: 1, Regular: 2, Mal: 3 }; const m = {}; daily.forEach(d => { if (!d.mens) return; if (!(d.date in m) || rank[d.mens] > rank[m[d.date]]) m[d.date] = d.mens; }); return m; }

function mesesDe(dates) { const ds = dates.filter(Boolean).sort(); if (!ds.length) return []; const out = []; let [y, m] = ds[0].slice(0, 7).split('-').map(Number); const [y1, m1] = ds[ds.length - 1].slice(0, 7).split('-').map(Number); while (y < y1 || (y === y1 && m <= m1)) { out.push(`${y}-${String(m).padStart(2, '0')}`); m++; if (m > 12) { m = 1; y++; } } return out; }

      <div class="tablebox"><table class="t"><thead><tr><th class="l">Jugadora</th><th>Rol</th><th>Min</th><th>RPE</th><th>UA</th></tr></thead><tbody>${rr.map(d => `<tr class="click" data-act="ficha" data-v="${esc(d.name)}"><td class="l"><b>${esc(title(d.name))}</b></td><td>${rolPill(d.rol)}</td><td>${fmt(d.min)}</td><td>${fmtA(d.rpe)}</td><td>${fmt(d.ua)}</td></tr>`).join('')}</tbody></table></div>`; } }
  return chips('spF', [['todos', 'Todos'], ['liga', 'Liga'], ['copa', 'Copas'], ['amistoso', 'Amistosos']], u.spF) + `<div class="list">${P.map(p => `<button class="item" data-act="spSel" data-v="${esc(p.k)}" style="text-align:left"><div><div class="t1">vs. ${esc(p.rival)}</div><div class="t2">${esc(fLarga(p.date))} · ${esc(p.comp)}</div></div><span class="small">${p.rows.filter(d => d.rol === 'T' || d.rol === 'S').length} jugadoras ›</span></button>`).join('') || '<div class="empty">Sin partidos.</div>'}</div>`;
}
/* --- páginas tipo Power BI --- */
const PBI = [['cargamc', 'Carga evolución MC'], ['acwr', 'ACWR'], ['entr', 'Carga ind. entrenos x MC'], ['ind', 'Carga ind. x MC'], ['rpe', 'Carga/RPE x MC'], ['general', 'General'], ['evol', 'Evolución wellness/RPE']];
function uaPorDia(daily, name) { const m = {}; daily.forEach(d => { if (d.ua == null || (name && d.name !== name)) return; m[d.date] = (m[d.date] || 0) + d.ua; }); return m; }
function acwr(daily, name, fin) { const m = uaPorDia(daily, name); let a = 0, c = 0; for (let i = 0; i < 28; i++) { const d = isoAdd(fin, -i); const v = m[d] || 0; if (i < 7) a += v; c += v; } const cr = c / 4; return cr > 0 ? a / cr : null; }
function sPBI() {
  const D = D7(); const u = S.u; u.pg = u.pg || 'cargamc';
  const mcs = uniq(D.daily.map(d => d.mc).filter(v => v != null)).sort((a, b) => a - b);
  if (u.pMc == null || !mcs.includes(u.pMc)) u.pMc = mcs[mcs.length - 1];
  const js = jugadorasStaff(); u.pJ = u.pJ || '';
  const base = D.daily.filter(d => !u.pJ || d.name === u.pJ);
  let h = `<label class="f">Página<select class="sel" data-chg="pg" style="font-weight:600">${PBI.map(([k, l]) => `<option value="${k}" ${k === u.pg ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
  const selMc = `<label class="f">Microciclo<select class="sel" data-chg="pMc">${mcs.slice().reverse().map(m => `<option value="${m}" ${m === u.pMc ? 'selected' : ''}>MC ${m}</option>`).join('')}</select></label>`;
  const selJ = `<label class="f">Jugadora<select class="sel" data-chg="pJ"><option value="">Todas</option>${js.map(j => `<option value="${esc(j.name)}" ${j.name === u.pJ ? 'selected' : ''}>${esc(title(j.name))}</option>`).join('')}</select></label>`;
  if (u.pg === 'cargamc') {
    h += `<div class="grid2">${selJ}</div>`;
    const vals = mcs.map(m => u.pJ ? sum(base.filter(d => d.mc === m).map(d => d.ua)) : (D.carga[m] != null ? D.carga[m] : null));
    h += `<div class="card"><h3>${u.pJ ? 'UA semanal · ' + esc(title(u.pJ)) : 'Carga semanal promedio del equipo (UA)'}</h3>${vbars(mcs.map((m, i) => ({ v: vals[i], txt: fmt(vals[i]), l1: String(m), color: (D.daily.find(d => d.mc === m) || {}).per && /pre/i.test((D.daily.find(d => d.mc === m) || {}).per) ? '#9DB1EE' : null })))}<div class="legend"><span><i style="background:#9DB1EE"></i>Pretemporada</span><span><i style="background:var(--acento)"></i>Liga</span></div></div>`;
    const lastV = vals.filter(v => v != null && v > 0); const lastI = vals.map((v, i) => v != null && v > 0 ? i : -1).filter(i => i >= 0).pop();
    h += `<div class="grid2"><div class="kpi"><span>Último MC con datos${lastI != null ? ' (MC ' + mcs[lastI] + ')' : ''}</span><b>${fmt(lastV[lastV.length - 1])} UA</b></div><div class="kpi"><span>Media temporada</span><b>${fmt(mean(lastV))} UA</b></div></div>`;
  } else if (u.pg === 'acwr') {
    h += `<div class="grid2">${selMc}</div>`;
    const fin = D.daily.filter(d => d.mc === u.pMc).map(d => d.date).sort().pop();
    const rows = js.filter(j => j.equipo !== 'B').map(j => ({ j, r: acwr(D.daily, j.name, fin) })).filter(x => x.r != null).sort((a, b) => b.r - a.r);
    h += `<div class="card"><h3>ACWR al cierre del MC ${u.pMc} (${esc(fCorta(fin))})</h3><p class="small" style="margin:0">UA de los últimos 7 días ÷ promedio semanal de 28 días. Zona de referencia 0,8–1,3.</p>
      <div class="tablebox"><table class="t"><thead><tr><th class="l">Jugadora</th><th>ACWR</th><th></th></tr></thead><tbody>${rows.map(x => `<tr class="click" data-act="ficha" data-v="${esc(x.j.name)}"><td class="l"><b>${esc(title(x.j.name))}</b></td><td><b>${fmt(x.r, 2)}</b></td><td>${x.r > 1.5 ? '<span class="pill l">Alto</span>' : x.r > 1.3 || x.r < 0.8 ? '<span class="pill s">Fuera de zona</span>' : '<span class="pill t">En zona</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
    const serie = mcs.map(m => { const f = D.daily.filter(d => d.mc === m).map(d => d.date).sort().pop(); return { m, v: u.pJ ? acwr(D.daily, u.pJ, f) : mean(js.filter(j => j.equipo !== 'B').map(j => acwr(D.daily, j.name, f))) }; });
    h += `<div class="grid2">${selJ}</div><div class="card"><h3>ACWR por microciclo · ${u.pJ ? esc(title(u.pJ)) : 'media del equipo'}</h3>${lineChart(serie.map(s => ({ v: s.v, l: 'MC' + s.m, txt: fmt(s.v, 2) })))}</div>`;
  } else if (u.pg === 'entr' || u.pg === 'ind') {
    h += `<div class="grid2">${selMc}</div>`;
    const rr = D.daily.filter(d => d.mc === u.pMc && (u.pg === 'ind' || !d.esP));
    const by = groupBy(rr.filter(d => d.ua != null), d => d.name);
    const bars = [...by.entries()].map(([n, a]) => ({ l: title(n), v: sum(a.map(d => d.ua)), act: 'ficha', val: n })).sort((a, b) => b.v - a.v);
    h += `<div class="card"><h3>${u.pg === 'entr' ? 'Carga de entrenamientos' : 'Carga total (con partido)'} · MC ${u.pMc} (UA)</h3>${bars.length ? hbars(bars) : '<div class="empty">Sin datos</div>'}</div>`;
  } else if (u.pg === 'rpe') {
    h += `<div class="grid2">${selJ}</div>`;
    h += `<div class="card"><h3>RPE medio por microciclo${u.pJ ? ' · ' + esc(title(u.pJ)) : ''}</h3>${lineChart(mcs.map(m => { const v = mean(base.filter(d => d.mc === m).map(d => d.rpe)); return { v, l: 'MC' + m, txt: fmtA(v) }; }))}</div>`;
    h += `<div class="card"><h3>UA por microciclo${u.pJ ? '' : ' (suma del equipo ÷ jugadoras)'}</h3>${vbars(mcs.map(m => { const rr = base.filter(d => d.mc === m && d.ua != null); const n = uniq(rr.map(d => d.name)).length || 1; const v = sum(rr.map(d => d.ua)) / (u.pJ ? 1 : n); return { v, txt: fmt(v), l1: String(m) }; }))}</div>`;
  } else if (u.pg === 'general') {
    h += `<div class="grid2">${selMc}${selJ}</div>`;
    const rr = base.filter(d => d.mc === u.pMc);
    h += `<div class="grid3"><div class="kpi"><span>UA total</span><b>${fmt(sum(rr.map(d => d.ua)))}</b></div><div class="kpi"><span>RPE medio</span><b>${fmtA(mean(rr.map(d => d.rpe)))}</b></div><div class="kpi"><span>Wellness medio</span><b>${fmtA(mean(rr.map(d => d.well)))}</b></div><div class="kpi"><span>Fatiga</span><b>${fmtA(mean(rr.map(d => d.fat)))}</b></div><div class="kpi"><span>Sueño</span><b>${fmtA(mean(rr.map(d => d.sue)))}</b></div><div class="kpi"><span>Estrés</span><b>${fmtA(mean(rr.map(d => d.est)))}</b></div></div>`;
    const dates = uniq(rr.map(d => d.date)).sort();
    h += `<div class="card"><h3>UA por día · MC ${u.pMc}</h3>${vbars(dates.map(f => { const x = rr.filter(d => d.date === f); const vv = u.pJ ? sum(x.map(d => d.ua)) : sum(x.map(d => d.ua)) / (uniq(x.map(d => d.name)).length || 1); return { v: vv, txt: fmt(vv), l1: DIA[dow(f)].slice(0, 1).toUpperCase(), l2: (x.find(d => d.md) || {}).md || fCorta(f), color: x.some(d => d.esP) ? 'var(--partido)' : null }; }))}</div>`;
  } else if (u.pg === 'evol') {
    h += `<div class="grid2">${selJ}</div>`;
    const dates = uniq(base.filter(d => d.well != null || d.rpe != null).map(d => d.date)).sort().slice(-40);
    h += `<div class="card"><h3>Wellness medio (últimos ${dates.length} días)</h3>${lineChart(dates.map(f => { const v = mean(base.filter(d => d.date === f).map(d => d.well)); return { v, l: fCorta(f), txt: fmtA(v) }; }))}</div>`;
    h += `<div class="card"><h3>RPE medio (últimos ${dates.length} días)</h3>${lineChart(dates.map(f => { const v = mean(base.filter(d => d.date === f).map(d => d.rpe)); return { v, l: fCorta(f), txt: fmtA(v) }; }), { color: 'var(--partido)' })}</div>`;
  }
  return h;
}
const SVISTAS = { plantel: sPlantel, carga: sCarga, well: sWell, mens: sMens, tests: sTests, part: sPartidos, pbi: sPBI };
function renderStaff() {
  const nav = `<nav class="snav" aria-label="Secciones">${STABS.map(([k, l]) => `<button class="${k === S.staffTab && !S.ficha ? 'on' : ''}" data-act="stab" data-v="${k}">${l}</button>`).join('')}</nav>`;
  let body;
  if (S.ficha) {
    S.season = '2627';
    const c = cuerpoJugadora(S.ficha, fotoDe(S.ficha), true);
    body = `<button class="back" data-act="cerrarFicha">‹ Volver</button><div style="display:flex;flex-direction:column;gap:12px">${c.head}</div>${chips('tab', c.tabs, S.tab)}${c.body}`;
  } else body = SVISTAS[S.staffTab]();
  $('#root').innerHTML = `<div class="wrap staff"><header class="shead"><div class="row"><b style="font-size:17px">${esc(CONFIG.titulo)}</b><span class="tag">Staff · solo lectura</span></div>${nav}</header>
    <main>${body}<p class="small" style="margin-top:16px">Datos actualizados: ${esc(S.resp.actualizado || '—')}</p><button class="btn" data-act="salir" style="align-self:center;font-size:13px">Cerrar sesión (${esc(S.email)})</button></main></div>`;
}

/* ===================== interacción ===================== */
function rerender(top) { (S.perfil === 'staff' ? renderStaff : render)(); if (top) window.scrollTo(0, 0); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v; const u = S.u;
  switch (a) {
    case 'salir': return salir();
    case 'tab': S.tab = v; return rerender(true);
    case 'season': S.season = v; S.u = {}; return rerender(true);
    case 'stab': S.staffTab = v; S.ficha = null; return rerender(true);
    case 'ficha': S.ficha = v; S.tab = 'inicio'; S.u = {}; return rerender(true);
    case 'fichaMens': S.ficha = v; S.tab = 'ciclo'; S.u = {}; return rerender(true);
    case 'fichaTests': S.ficha = v; S.tab = 'tests'; S.u = { tK: u.stK }; return rerender(true);
    case 'cerrarFicha': S.ficha = null; S.u = {}; return rerender(true);
    case 'wI': case 'swI': case 'gP': u[a] = Number(v); return rerender();
    case 'rpeMc': case 'wMc': case 'gMc': if (v === 'undefined') return; u[a] = Number(v); return rerender();
    case 'mMes': if (v === 'undefined') return; u[a] = v; return rerender();
    case 'spSel': u.spSel = v || null; return rerender(true);
    default: u[a] = v; return rerender();
  }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (!el) return; const k = el.dataset.chg; S.u[k] = ['cMc', 'pMc'].includes(k) ? Number(el.value) : el.value; rerender(); });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (!el) return; S.u[el.dataset.inp] = el.value; const pos = el.selectionStart; rerender(); const n = document.querySelector('[data-inp="' + el.dataset.inp + '"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } });

pantallaEntrada();
</script>
